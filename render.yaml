# Formatly on Render: one service, no disk.
#
# Deploy: New → Blueprint, pointed at this repository. Everything below is read
# from here; two secrets are typed into the dashboard. The walkthrough, and how
# to get the database, is in DEPLOY.md.
#
# There is no disk on purpose. Everything that must survive a restart — the
# documents, their whole version history, the accounts, the composed drafts —
# lives in Postgres, which is why the free instance is usable: its filesystem
# is wiped on every deploy and nothing here minds. What is left on disk is only
# ever regenerated output.

services:
  - type: web
    name: formatly
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Near your readers, and near the database: a query crossing an ocean does
    # it on every version read.
    region: frankfurt
    plan: free

    healthCheckPath: /health

    envVars:
      # The Supabase connection string, from Connect → Transaction pooler.
      # The pooler rather than the direct connection: a free project's direct
      # address is reachable over IPv6 only, and most hosts are not.
      - key: DATABASE_URL
        sync: false          # typed into the dashboard; it holds the password

      # Generated once by Render and kept. Letting the container invent one
      # instead would log everybody out on every restart.
      - key: DOCOS_SECRET
        generateValue: true

      # The planner. Without it the app still runs — instructions are answered
      # by the rules, and the panel says so rather than pretending.
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-medium-latest

      # Nothing is cross-origin: this service serves the page and answers it.
      # Only needed if the frontend is ever hosted somewhere else.
      # - key: ALLOWED_ORIGINS
      #   value: https://your-frontend.example
